<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Тусклая желтая орбита (повернута по часовой стрелке) -->
  <ellipse cx="50" cy="50" rx="45" ry="15" fill="none" stroke="rgba(251, 191, 36, 0.4)" stroke-width="4" transform="rotate(-25 50 50)" />

  <!-- Золотое кольцо (контур планеты) -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#fbbf24" stroke-width="5" />

  <!-- Фиолетовый центр -->
  <circle cx="50" cy="50" r="14" fill="#c084fc" />
</svg>